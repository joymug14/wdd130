<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us- The Rapid Splash</title>
    <meta name="description" content="Contact The Rapid Splash company to ask questions, make reservations or 
            give us your feedback on our rafting services   ">
    <meta name="author" content="Joyce Chizondo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-therapidssplash.jpg" alt="Logo of The Rapid Splash">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>The Rapid Splash Company</h1>
            <p>153rd Livingstone Way</p>
            <p>Victoria Falls, Zimbabwe</p>
            <p>+263777 777 7777</p>
            <p>info@therapidsplash.com</p>
        </div>

        <div class="contact-grid">

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d121473.8776324129!2d25.769422158203135!3d-17.92941699999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x194feff6ea92e63d%3A0xda7af4fefbafe8cf!2sShearwater%20Whitewater%20Rafting!5e0!3m2!1sen!2szw!4v1795780135655!5m2!1sen!2szw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>


            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email:</label>
                <input type="email" id="useremail" name="useremail" placeholder="Placeholder">

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general">General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation">Reservation</label>
                    <label><input type="radio" name="purpose" value="suggestion">Website Suggestions</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Type here"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="subscribe">Please subscribe me to the monthy newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/raftingcrew-guide.jpg" alt="Rafting guide">
                    <figcaption>Adventure Rafitng Guide </figcaption>
                </figure>
                <figure>
                    <img src="images/adventure-bookings.jpg" alt="Adventure Bookings Officer">
                    <figcaption>Administration and Bookings</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-guide.jpg" alt="Rafting crew guide">
                    <figcaption>Team Leader Rafting Crew </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; | 2026 |The Rapid Splash | Joyce Chizondo</p>
        <nav class="socialmedia">
            <a href="">
                <img src="images/facebook.jpg" alt="facebook">
            </a>
            <a href="">
                <img src="images/twitter.jpg" alt="twitter">
            </a>
            <a href="">
                <img src="images/instagram.jpg" alt="instagram ">
            </a>
        </nav>
    </footer>
</body>

</html>
