<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic  HTML structure example using semantic HTML elements">
    <meta name="author" content="Joyce Chizondo">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="HTML Layout Logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.researchgate.net">Research Gate</a></li>
            <li><a href="https://www.pearson.com">Pearson</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Odit, ut.</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Animi, quae.</p>
        </section>
    </main>
    <aside>
        <img src="https://www.churchofjesuschrist.org/imgs/qmtphag0tdp0sot6yoiejjv9wx6arx7gcu0k4vl0/full/800%2C/0/default" alt="Zimbabwe Harare Temple" width="200">
    </aside>
    <footer>
        <p>Joyce Chizondo</p>
    </footer>
</body>

</html>
